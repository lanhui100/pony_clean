             C 630 182, 632 234, 622 272 Z"
          fill="#181818"/>
    <path d="M 650 264
             C 652 204, 668 154, 706 128
             C 728 168, 736 220, 730 258 Z"
          fill="#181818"/>
    <!-- eye -->
    <circle cx="658" cy="408" r="20" fill="#181818"/>
  </g>
</svg>

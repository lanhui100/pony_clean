<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- PonyClean icon v14a: bold abstract line-art, transparent background -->
  <g transform="translate(-44,0)">
    <!-- mane: three tapered locks, varied length, sweeping down-left -->
    <g fill="#D0342C">
      <path d="M 584 256
               C 462 292, 340 368, 244 474
               C 368 398, 486 340, 606 312
               C 600 292, 592 274, 584 256 Z"/>
      <path d="M 566 350
               C 470 392, 372 470, 296 592
               C 396 512, 490 454, 590 420
               C 582 396, 574 372, 566 350 Z"/>
      <path d="M 548 446
               C 462 498, 382 578, 322 716
               C 416 634, 492 576, 570 528
               C 562 500, 556 472, 548 446 Z"/>
    </g>
    <!-- face profile: poll -> convex forehead -> LONG STRAIGHT nose -> small lip hook -->
    <path d="M 566 286
             C 620 296, 668 330, 700 360
             C 770 440, 830 520, 854 572
             C 856 588, 850 614, 828 618"
          fill="none" stroke="#181818" stroke-width="54" stroke-linecap="round"/>

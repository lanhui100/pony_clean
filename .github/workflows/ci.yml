name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo build
        env:
          RUSTFLAGS: "-D warnings"
      - run: cargo clippy -- -D warnings
      - run: cargo test
        env:
          RUSTFLAGS: "-D warnings"
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  version-sync:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-version.mjs
        name: 版本一致性（三处清单 + Cargo.lock 成员条目）
      - run: node --test "scripts/*.test.mjs"
        name: 版本工具契约测试

  # 门被门检验（P2）：决策格式门 + 负样本 spec 入 CI——本地 pre-commit 守提交时，
  # CI 守"门禁本身没失效"（负样本必须持续被拒）。不依赖 Rust 工具链，独立快速。
  governance-gates:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 决策格式门（正样本：现有 notes 全过）
        run: bash .meta/gates/notes-format.sh
      - name: 决策格式门负样本 spec（非法样本必须被拒）
        run: bash .meta/gates/notes-format.spec.sh

name: CI

on: [push, pull_request]

jobs:
  unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test -p pony_core --lib -- --test-threads=4
        name: Unit tests

  integration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test -p pony_core --test integration_cleaner -- --test-threads=1
        name: Integration tests

  clippy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo clippy -p pony_core -p pony_clean -- -D warnings
        name: Clippy
